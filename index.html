<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <title>امروز</title>
  <!-- فونت سیستم طراحی IRANYekanX FaNum است؛ اگر فایلش را دارید با @font-face اضافه کنید. Vazirmatn جایگزین موقت است. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* =====================================================================
       توکن‌ها — دقیقاً از متغیرهای فیگما
       Color Seed · Size & Spacing · Typography (Mobile)
       ===================================================================== */
    :root {
      /* Color Seed — LightMode */
      --mauve-50: #faf9fc; --mauve-100: #f6f3f8; --mauve-200: #e9e5ee; --mauve-300: #d7d1de; --mauve-400: #a79db4; --mauve-500: #786d87; --mauve-600: #584f66; --mauve-700: #443b52; --mauve-800: #2d2438; --mauve-900: #1c1326; --mauve-950: #0a0314;
      --gray-50: #f9fafb; --gray-100: #f3f4f6; --gray-200: #e5e7eb; --gray-300: #d1d5db; --gray-400: #9ca3af; --gray-500: #6b7280; --gray-600: #4b5563; --gray-700: #374151; --gray-800: #1f2937; --gray-900: #111827; --gray-950: #030712;
      --purple-50: #faf5ff; --purple-100: #f3e8ff; --purple-200: #e9d5ff; --purple-300: #d8b4fe; --purple-400: #c084fc; --purple-500: #a855f7; --purple-600: #9333ea; --purple-700: #7e22ce; --purple-800: #6b21a8; --purple-900: #581c87; --purple-950: #3b0764;
      --red-50: #fef2f2; --red-100: #fee2e2; --red-200: #fecaca; --red-300: #fca5a5; --red-400: #f87171; --red-500: #ef4444; --red-600: #dc2626; --red-700: #b91c1c; --red-800: #991b1b; --red-900: #7f1d1d; --red-950: #450a0a;
      --emerald-50: #ecfdf5; --emerald-100: #d1fae5; --emerald-200: #a7f3d0; --emerald-300: #6ee7b7; --emerald-400: #34d399; --emerald-500: #10b981; --emerald-600: #059669; --emerald-700: #047857; --emerald-800: #065f46; --emerald-900: #064e3b; --emerald-950: #022c22;

      /* Size & Spacing — padding / gap */
      --space-none: 0px; --space-3xs: 2px; --space-2xs: 4px; --space-xs: 8px; --space-sm: 12px;
      --space-md: 16px; --space-lg: 20px; --space-xl: 24px; --space-2xl: 32px; --space-3xl: 40px;
      --space-4xl: 48px; --space-5xl: 56px; --space-6xl: 64px; --space-7xl: 80px; --space-8xl: 96px;
      /* Size & Spacing — height / size */
      --height-2xl: 32px; --height-3xl: 40px; --height-4xl: 48px; --height-5xl: 56px;
      --size-md: 16px; --size-lg: 20px; --size-xl: 24px; --size-2xl: 32px;
      /* Size & Spacing — radius */
      --radius-3xs: 2px; --radius-2xs: 4px; --radius-xs: 8px; --radius-sm: 12px; --radius-md: 16px;
      --radius-lg: 20px; --radius-xl: 24px; --radius-full: 9999px;

      /* Typography — Mobile/font-NN (size / line-height) */
      --font-family: "IRANYekanXFaNum", "IRANYekanX FaNum", "Vazirmatn", Tahoma, sans-serif;
      --font-weight-regular: 400; --font-weight-medium: 500; --font-weight-demibold: 600; --font-weight-bold: 700;
      --font-02: 10px/16px var(--font-family);
      --font-04: 12px/20px var(--font-family);
      --font-06: 14px/24px var(--font-family);
      --font-07: 16px/28px var(--font-family);
      --font-09: 20px/32px var(--font-family);

      /* نقش‌ها — همه به پالت اشاره می‌کنند، پس در حالت تاریک خودکار برعکس می‌شوند */
      --color-page: var(--mauve-50);
      --color-surface: var(--mauve-50);
      --color-surface-raised: var(--mauve-100);
      --color-surface-strong: var(--mauve-200);
      --color-border: var(--mauve-200);
      --color-border-strong: var(--mauve-300);
      --color-text: var(--mauve-900);
      --color-text-secondary: var(--mauve-600);
      --color-text-muted: var(--mauve-500);
      --color-icon: var(--mauve-600);
      --color-primary: var(--purple-600);
      --color-primary-hover: var(--purple-700);
      --color-on-primary: var(--purple-50);
      --color-primary-subtle: var(--purple-100);
      --color-primary-subtle-text: var(--purple-700);
      --color-progress: var(--purple-200);
      --color-danger: var(--red-600);
      --color-danger-subtle: var(--red-100);
      --color-toast: var(--mauve-900);
      --color-on-toast: var(--mauve-50);
      --color-overlay: color-mix(in srgb, var(--mauve-950) 40%, transparent);
      --shadow-raised: 0 0 var(--space-xs) color-mix(in srgb, var(--mauve-950) 12%, transparent);

      color-scheme: light;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    /* حالت تاریک: همان قاعده‌ی فایل فیگما — هر پالت برعکس می‌شود (50 ↔ 950) */
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        /* Color Seed — DarkMode (برعکس LightMode) */
        --mauve-50: #0a0314; --mauve-100: #1c1326; --mauve-200: #2d2438; --mauve-300: #443b52; --mauve-400: #584f66; --mauve-500: #786d87; --mauve-600: #a79db4; --mauve-700: #d7d1de; --mauve-800: #e9e5ee; --mauve-900: #f6f3f8; --mauve-950: #faf9fc;
        --gray-50: #030712; --gray-100: #111827; --gray-200: #1f2937; --gray-300: #374151; --gray-400: #4b5563; --gray-500: #6b7280; --gray-600: #9ca3af; --gray-700: #d1d5db; --gray-800: #e5e7eb; --gray-900: #f3f4f6; --gray-950: #f9fafb;
        --purple-50: #3b0764; --purple-100: #581c87; --purple-200: #6b21a8; --purple-300: #7e22ce; --purple-400: #9333ea; --purple-500: #a855f7; --purple-600: #c084fc; --purple-700: #d8b4fe; --purple-800: #e9d5ff; --purple-900: #f3e8ff; --purple-950: #faf5ff;
        --red-50: #450a0a; --red-100: #7f1d1d; --red-200: #991b1b; --red-300: #b91c1c; --red-400: #dc2626; --red-500: #ef4444; --red-600: #f87171; --red-700: #fca5a5; --red-800: #fecaca; --red-900: #fee2e2; --red-950: #fef2f2;
        --emerald-50: #022c22; --emerald-100: #064e3b; --emerald-200: #065f46; --emerald-300: #047857; --emerald-400: #059669; --emerald-500: #10b981; --emerald-600: #34d399; --emerald-700: #6ee7b7; --emerald-800: #a7f3d0; --emerald-900: #d1fae5; --emerald-950: #ecfdf5;
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      /* Color Seed — DarkMode (برعکس LightMode) */
      --mauve-50: #0a0314; --mauve-100: #1c1326; --mauve-200: #2d2438; --mauve-300: #443b52; --mauve-400: #584f66; --mauve-500: #786d87; --mauve-600: #a79db4; --mauve-700: #d7d1de; --mauve-800: #e9e5ee; --mauve-900: #f6f3f8; --mauve-950: #faf9fc;
      --gray-50: #030712; --gray-100: #111827; --gray-200: #1f2937; --gray-300: #374151; --gray-400: #4b5563; --gray-500: #6b7280; --gray-600: #9ca3af; --gray-700: #d1d5db; --gray-800: #e5e7eb; --gray-900: #f3f4f6; --gray-950: #f9fafb;
      --purple-50: #3b0764; --purple-100: #581c87; --purple-200: #6b21a8; --purple-300: #7e22ce; --purple-400: #9333ea; --purple-500: #a855f7; --purple-600: #c084fc; --purple-700: #d8b4fe; --purple-800: #e9d5ff; --purple-900: #f3e8ff; --purple-950: #faf5ff;
      --red-50: #450a0a; --red-100: #7f1d1d; --red-200: #991b1b; --red-300: #b91c1c; --red-400: #dc2626; --red-500: #ef4444; --red-600: #f87171; --red-700: #fca5a5; --red-800: #fecaca; --red-900: #fee2e2; --red-950: #fef2f2;
      --emerald-50: #022c22; --emerald-100: #064e3b; --emerald-200: #065f46; --emerald-300: #047857; --emerald-400: #059669; --emerald-500: #10b981; --emerald-600: #34d399; --emerald-700: #6ee7b7; --emerald-800: #a7f3d0; --emerald-900: #d1fae5; --emerald-950: #ecfdf5;
      color-scheme: dark;
    }
    html { scroll-padding-top: env(safe-area-inset-top, 0px); }

    * { box-sizing: border-box; margin: 0; }
    html, body { min-height: 100%; }
    body { background: var(--color-page); color: var(--color-text); font: var(--font-07); font-weight: var(--font-weight-regular); }
    button, input, textarea { font: inherit; color: inherit; }
    button { border: 0; background: none; padding: 0; cursor: pointer; }
    :focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; }
    svg { display: block; flex-shrink: 0; }
    [hidden] { display: none !important; }
    .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

    .screen {
      max-width: 440px; min-height: 100vh; min-height: 100dvh; margin-inline: auto;
      padding: var(--space-xl) var(--space-xl) 0;
      display: flex; flex-direction: column;
    }

    /* ---------- هدر ---------- */
    .top-bar { display: flex; justify-content: space-between; align-items: center; }
    .icon-button {
      width: var(--height-4xl); height: var(--height-4xl); display: grid; place-items: center;
      color: var(--color-icon); background: var(--color-surface-raised); border-radius: var(--radius-sm);
    }
    .greeting { font: var(--font-09); font-weight: var(--font-weight-medium); margin-top: var(--space-md); }

    /* ---------- انتخاب روز + نوار پیشرفت ---------- */
    .day-picker { display: flex; gap: var(--space-sm); margin-top: var(--space-xl); }
    .date-field { flex: 1; position: relative; min-width: 0; }
    .date-selector {
      position: relative; overflow: hidden; isolation: isolate;
      width: 100%; height: var(--height-5xl); display: flex; align-items: center; gap: var(--space-xs);
      padding-inline: var(--space-md); text-align: right;
      background: var(--color-surface-raised); border-radius: var(--radius-sm);
    }
    .date-selector .progress-fill {
      position: absolute; inset-block: 0; inset-inline-start: 0; z-index: -1;
      width: var(--progress, 0%); background: var(--color-progress);
      transition: width .4s ease;
    }
    .date-selector .label { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .date-selector svg { color: var(--color-icon); transition: transform .2s; }
    .date-selector[aria-expanded="true"] svg { transform: rotate(180deg); }
    .tomorrow {
      width: var(--height-5xl); height: var(--height-5xl); flex-shrink: 0;
      background: var(--color-surface-raised); border-radius: var(--radius-sm);
      font: var(--font-06); color: var(--color-text-secondary);
    }
    .tomorrow[aria-pressed="true"] { background: var(--color-primary-subtle); color: var(--color-primary-subtle-text); font-weight: var(--font-weight-medium); }
    .date-menu {
      position: absolute; inset-inline: 0; top: calc(100% + var(--space-xs)); z-index: 20;
      list-style: none; padding: var(--space-xs); background: var(--color-surface);
      border-radius: var(--radius-sm); box-shadow: var(--shadow-raised);
    }
    .date-menu li { padding: var(--space-xs) var(--space-sm); border-radius: var(--radius-xs); cursor: pointer; }
    .date-menu li[aria-selected="true"] { color: var(--color-primary); font-weight: var(--font-weight-medium); }
    .date-menu li:hover, .date-menu li.is-active { background: var(--color-surface-raised); }
    .summary { font: var(--font-04); color: var(--color-text-muted); margin-top: var(--space-xs); }

    /* ---------- فیلترها و جستجو ---------- */
    .toolbar { display: flex; align-items: center; gap: var(--space-xs); margin-top: var(--space-md); }
    .filters { display: flex; gap: var(--space-xs); flex: 1; min-width: 0; }
    .chip {
      flex: 1; max-width: var(--space-8xl); height: var(--height-2xl); padding-inline: var(--space-sm);
      border-radius: var(--radius-xs); border: 1px solid var(--color-border);
      font: var(--font-06); color: var(--color-text-secondary); white-space: nowrap;
    }
    .chip[aria-pressed="true"] { background: var(--color-primary); border-color: var(--color-primary); color: var(--color-on-primary); font-weight: var(--font-weight-medium); }
    .search-field {
      flex: 1; min-width: 0; height: var(--height-2xl); padding-inline: var(--space-sm);
      border: 1px solid var(--color-border); border-radius: var(--radius-xs);
      background: var(--color-surface); font: var(--font-06);
    }
    .search-field:focus { outline: none; border-color: var(--color-primary); }
    .search-button {
      width: var(--height-2xl); height: var(--height-2xl); flex-shrink: 0; margin-inline-start: auto;
      display: grid; place-items: center; color: var(--color-icon);
      background: var(--color-surface-raised); border-radius: var(--radius-xs);
    }
    .search-button[aria-pressed="true"] { background: var(--color-primary); color: var(--color-on-primary); }

    /* ---------- کارت کار ---------- */
    .tasks { list-style: none; padding: var(--space-xl) 0 0; display: flex; flex-direction: column; gap: var(--space-sm); }
    .task { position: relative; border-radius: var(--radius-sm); overflow: hidden; }
    .task-actions {
      position: absolute; inset-block: 0; inset-inline-start: 0;
      display: flex; gap: var(--space-2xs); padding: var(--space-2xs);
    }
    .task-action {
      width: var(--height-5xl); display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: var(--space-3xs); border-radius: var(--radius-xs); font: var(--font-02); font-weight: var(--font-weight-medium);
    }
    .task-action svg { width: var(--size-lg); height: var(--size-lg); }
    .task-action--edit { background: var(--color-primary-subtle); color: var(--color-primary-subtle-text); }
    .task-action--delete { background: var(--color-danger-subtle); color: var(--color-danger); }
    .task-body {
      position: relative; min-height: var(--height-5xl); padding: var(--space-sm) var(--space-md) var(--space-sm) var(--space-md);
      padding-inline-start: var(--space-xs);
      display: flex; align-items: center; gap: var(--space-xs);
      background: var(--color-surface-raised); border: 1px solid var(--color-surface-raised); border-radius: var(--radius-sm);
      transition: transform .25s ease, background-color .2s, border-color .2s; touch-action: pan-y;
    }
    .task.is-open .task-body { transform: translateX(calc(-1 * var(--swipe))); }
    .task.is-dragging .task-body { transition: none; }
    .kebab {
      width: var(--height-3xl); height: var(--height-3xl); flex-shrink: 0; display: grid; place-items: center;
      color: var(--color-icon); border-radius: var(--radius-xs);
    }
    .kebab[aria-expanded="true"] { background: var(--color-surface-strong); }
    .kebab svg { width: var(--size-lg); height: var(--size-lg); }
    .task-text { flex: 1; min-width: 0; display: flex; flex-direction: column; cursor: pointer; }
    .task-title { font: var(--font-07); font-weight: var(--font-weight-medium); overflow-wrap: anywhere; }
    .task-desc { font: var(--font-04); color: var(--color-text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .task-meta { display: flex; flex-direction: column; align-items: flex-end; gap: var(--space-2xs); flex-shrink: 0; }
    .task-time { font: var(--font-06); color: var(--color-text-secondary); direction: ltr; unicode-bidi: isolate; }
    .badge {
      font: var(--font-02); color: var(--color-text-secondary); background: var(--color-surface);
      border-radius: var(--radius-full); padding: 0 var(--space-xs);
    }

    /* انجام شده: بدون پس‌زمینه، خط‌خورده و کم‌رنگ — کاملاً متفاوت از کار باز */
    .task.is-done .task-body { background: var(--color-page); border: 1px dashed var(--color-border-strong); }
    .task.is-done .task-title { color: var(--color-text-muted); font-weight: var(--font-weight-regular); text-decoration: line-through; text-decoration-color: var(--color-text-muted); }
    .task.is-done .task-desc, .task.is-done .task-time { color: var(--color-text-muted); }
    .task.is-done .task-time { text-decoration: line-through; }
    .task.is-done .badge { background: var(--color-surface-raised); color: var(--color-text-muted); }

    /* چک‌باکس */
    .check {
      appearance: none; width: var(--size-xl); height: var(--size-xl); flex-shrink: 0; margin: 0; cursor: pointer;
      border: 2px solid var(--color-border-strong); border-radius: var(--radius-2xs); background: var(--color-surface);
      display: grid; place-items: center; transition: background-color .15s, border-color .15s;
    }
    .check::after {
      content: ""; width: 6px; height: 11px; margin-top: -3px;
      border: solid var(--color-on-primary); border-width: 0 2px 2px 0; transform: rotate(45deg) scale(0); transition: transform .15s;
    }
    .check:checked { background: var(--color-primary); border-color: var(--color-primary); }
    .check:checked::after { transform: rotate(45deg) scale(1); }

    .no-results { text-align: center; color: var(--color-text-muted); font: var(--font-06); padding-top: var(--space-3xl); }

    /* ---------- حالت خالی ---------- */
    .empty {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
      gap: var(--space-2xs); padding-bottom: var(--space-8xl); text-align: center;
      font: var(--font-06); color: var(--color-text-secondary);
    }

    /* ---------- ناوبری پایین ---------- */
    .list-end { flex: 1; min-height: var(--space-xl); }
    .nav-wrap {
      position: sticky; bottom: 0; z-index: 10; margin-top: calc(-1 * var(--space-xl));
      padding: var(--space-xl) 0 calc(var(--space-sm) + env(safe-area-inset-bottom, 0px));
      background: linear-gradient(to bottom, transparent, var(--color-page) 40%);
    }
    .bottom-nav {
      display: flex; justify-content: space-between; align-items: center; padding: var(--space-sm) var(--space-md);
      background: var(--color-surface); border-radius: var(--radius-xl); box-shadow: var(--shadow-raised);
    }
    .nav-tab {
      width: var(--space-7xl); height: var(--height-4xl); display: grid; place-items: center;
      color: var(--color-icon); border-radius: var(--radius-md);
    }
    .nav-tab--add { background: var(--color-primary); color: var(--color-on-primary); }
    .nav-tab--add:hover { background: var(--color-primary-hover); }

    /* ---------- برگه‌ی افزودن / ویرایش (یکسان) ---------- */
    .sheet {
      border: 0; width: 100%; max-width: 440px; margin: auto auto var(--keyboard, 0px);
      max-height: calc(92vh - var(--keyboard, 0px)); max-height: calc(92dvh - var(--keyboard, 0px));
      overflow-y: auto; overscroll-behavior: contain;
      padding: var(--space-xl) var(--space-xl) calc(var(--space-xl) + env(safe-area-inset-bottom, 0px));
      border-radius: var(--radius-xl) var(--radius-xl) 0 0; box-shadow: var(--shadow-raised);
      background: var(--color-surface); color: var(--color-text);
    }
    .sheet::backdrop { background: var(--color-overlay); }
    .sheet-title { font: var(--font-07); font-weight: var(--font-weight-demibold); margin-bottom: var(--space-md); }
    .sheet form { display: flex; flex-direction: column; gap: var(--space-md); }
    .field {
      width: 100%; border: 1px solid var(--color-surface-raised); border-radius: var(--radius-sm);
      background: var(--color-surface-raised); color: var(--color-text); font: var(--font-07);
    }
    .field:focus, .field[aria-expanded="true"] { outline: none; border-color: var(--color-primary); }
    .field::placeholder { color: var(--color-text-muted); }
    .field--text { height: var(--height-4xl); padding-inline: var(--space-md); }
    .field--area { height: var(--space-8xl); padding: var(--space-sm) var(--space-md); resize: none; }
    .field-row { display: flex; gap: var(--space-xs); }
    .picker-trigger {
      flex: 1; min-width: 0; height: var(--height-4xl); display: flex; align-items: center; gap: var(--space-xs);
      padding-inline: var(--space-sm); text-align: right;
    }
    .picker-trigger svg { color: var(--color-icon); width: var(--size-lg); height: var(--size-lg); }
    .picker-trigger .value { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .picker-trigger .value.is-empty { color: var(--color-text-muted); }

    .picker {
      border: 1px solid var(--color-border); border-radius: var(--radius-sm);
      padding: var(--space-sm); display: flex; flex-direction: column; gap: var(--space-sm);
    }
    .picker-actions { display: flex; justify-content: space-between; gap: var(--space-xs); }
    .text-button {
      height: var(--height-2xl); padding-inline: var(--space-sm); border-radius: var(--radius-xs);
      font: var(--font-06); font-weight: var(--font-weight-medium); color: var(--color-primary);
    }
    .text-button:hover { background: var(--color-primary-subtle); }
    .text-button--muted { color: var(--color-text-secondary); }
    .text-button--muted:hover { background: var(--color-surface-raised); }

    /* ساعت */
    .time-columns { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-xs); }
    .time-col-label { font: var(--font-04); color: var(--color-text-muted); text-align: center; margin-bottom: var(--space-2xs); }
    .time-list {
      height: calc(var(--height-3xl) * 4 + var(--space-3xs) * 3 + var(--space-2xs) * 2); overflow-y: auto; overscroll-behavior: contain; scroll-snap-type: y proximity;
      display: flex; flex-direction: column; gap: var(--space-3xs);
      background: var(--color-surface-raised); border-radius: var(--radius-xs); padding: var(--space-2xs);
    }
    .time-option {
      flex-shrink: 0; height: var(--height-3xl); border-radius: var(--radius-xs); scroll-snap-align: center;
      font: var(--font-07); color: var(--color-text-secondary);
    }
    .time-option:hover { background: var(--color-surface-strong); }
    .time-option[aria-selected="true"] { background: var(--color-primary); color: var(--color-on-primary); font-weight: var(--font-weight-medium); }

    /* تاریخ */
    .quick-dates { display: flex; gap: var(--space-xs); }
    .quick-date {
      flex: 1; height: var(--height-2xl); border-radius: var(--radius-xs); border: 1px solid var(--color-border);
      font: var(--font-06); color: var(--color-text-secondary);
    }
    .quick-date[aria-pressed="true"] { background: var(--color-primary-subtle); border-color: var(--color-primary-subtle); color: var(--color-primary-subtle-text); font-weight: var(--font-weight-medium); }
    .cal-head { display: flex; align-items: center; justify-content: space-between; }
    .cal-title { font: var(--font-06); font-weight: var(--font-weight-demibold); }
    .cal-nav { width: var(--height-2xl); height: var(--height-2xl); display: grid; place-items: center; border-radius: var(--radius-xs); color: var(--color-icon); }
    .cal-nav:hover { background: var(--color-surface-raised); }
    .cal-nav--prev svg { transform: rotate(-90deg); }
    .cal-nav--next svg { transform: rotate(90deg); }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: var(--space-3xs); text-align: center; }
    .cal-weekday { font: var(--font-04); color: var(--color-text-muted); padding-block: var(--space-2xs); }
    .cal-day {
      height: var(--height-3xl); border-radius: var(--radius-xs); font: var(--font-06); color: var(--color-text);
    }
    .cal-day:hover { background: var(--color-surface-raised); }
    .cal-day.is-past { color: var(--color-text-muted); }
    .cal-day.is-today { box-shadow: inset 0 0 0 1px var(--color-primary); color: var(--color-primary); font-weight: var(--font-weight-medium); }
    .cal-day[aria-pressed="true"] { background: var(--color-primary); color: var(--color-on-primary); font-weight: var(--font-weight-medium); box-shadow: none; }

    .repeat { display: flex; align-items: center; gap: var(--space-xs); cursor: pointer; font: var(--font-06); }
    .repeat-hint { font: var(--font-04); color: var(--color-text-muted); margin-top: calc(-1 * var(--space-xs)); }
    .sheet-actions { display: flex; gap: var(--space-xs); margin-top: var(--space-xs); }
    .btn {
      flex: 1; height: var(--height-4xl); border-radius: var(--radius-sm);
      font: var(--font-07); font-weight: var(--font-weight-medium);
    }
    .btn--primary { background: var(--color-primary); color: var(--color-on-primary); }
    .btn--primary:hover:not(:disabled) { background: var(--color-primary-hover); }
    .btn--primary:disabled { opacity: .45; cursor: not-allowed; }
    .btn--secondary { background: var(--color-surface-raised); color: var(--color-text-secondary); }

    /* ---------- توست ---------- */
    .toast-region {
      position: fixed; inset-inline: 0; bottom: calc(var(--height-4xl) + var(--space-sm) * 3 + var(--space-xl) + env(safe-area-inset-bottom, 0px)); z-index: 30;
      display: flex; justify-content: center; padding-inline: var(--space-xl); pointer-events: none;
    }
    .toast {
      width: 100%; max-width: 392px; display: flex; align-items: center; gap: var(--space-sm);
      padding: var(--space-xs) var(--space-xs) var(--space-xs) var(--space-md);
      padding-inline-start: var(--space-md);
      background: var(--color-toast); color: var(--color-on-toast); border-radius: var(--radius-sm);
      box-shadow: var(--shadow-raised); font: var(--font-06); pointer-events: auto;
      animation: toast-in .2s ease;
    }
    .toast .message { flex: 1; min-height: var(--height-3xl); display: flex; align-items: center; }
    .toast-undo {
      height: var(--height-3xl); padding-inline: var(--space-sm); border-radius: var(--radius-xs);
      color: var(--purple-300); font-weight: var(--font-weight-demibold);
    }
    .toast-undo:hover { background: color-mix(in srgb, var(--color-on-toast) 12%, transparent); }
    @keyframes toast-in { from { opacity: 0; transform: translateY(var(--space-xs)); } }

    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
  </style>

      <div class="picker" id="time-picker" hidden>
        <div class="time-columns">
          <div><p class="time-col-label" id="hours-label">ساعت</p><div class="time-list" id="hours" role="listbox" aria-labelledby="hours-label"></div></div>
          <div><p class="time-col-label" id="minutes-label">دقیقه</p><div class="time-list" id="minutes" role="listbox" aria-labelledby="minutes-label"></div></div>
        </div>
        <div class="picker-actions">
          <button class="text-button text-button--muted" type="button" id="time-clear">بدون ساعت</button>
          <button class="text-button" type="button" id="time-done">تأیید</button>
        </div>
      </div>

      <div class="picker" id="date-picker" hidden>
        <div class="quick-dates" role="group" aria-label="انتخاب سریع">
          <button class="quick-date" type="button" data-quick="0">امروز</button>
          <button class="quick-date" type="button" data-quick="1">فردا</button>
          <button class="quick-date" type="button" data-quick="none">بدون تاریخ</button>
        </div>
        <div class="cal-head">
          <button class="cal-nav cal-nav--prev" type="button" id="cal-prev" aria-label="ماه قبل"><svg aria-hidden="true" focusable="false" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 13.2L16.6 8.6L18 10L12 16L6 10L7.4 8.6L12 13.2Z" fill="currentColor"/></svg></button>
          <p class="cal-title" id="cal-title" aria-live="polite"></p>
          <button class="cal-nav cal-nav--next" type="button" id="cal-next" aria-label="ماه بعد"><svg aria-hidden="true" focusable="false" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 13.2L16.6 8.6L18 10L12 16L6 10L7.4 8.6L12 13.2Z" fill="currentColor"/></svg></button>
        </div>
        <div class="cal-grid" id="cal-grid"></div>
      </div>

      <label class="visually-hidden" for="task-desc">توضیحات</label>
      <textarea class="field field--area" id="task-desc" maxlength="300" placeholder="توضیحات .."></textarea>

      <label class="repeat">
        <input class="check" id="task-repeat" type="checkbox" />
        <span>هر روز</span>
      </label>

      <div class="sheet-actions">
        <button class="btn btn--primary" id="save-task" type="submit" value="save" formnovalidate disabled>افزودن</button>
        <button class="btn btn--secondary" type="submit" value="cancel" formnovalidate>انصراف</button>
      </div>
    </form>
  </dialog>

  <template id="task-template">
    <li class="task">
      <div class="task-actions">
        <button class="task-action task-action--edit" type="button" data-action="edit" tabindex="-1"><svg aria-hidden="true" focusable="false" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="m13.26 3.6-8.21 8.69c-.31.33-.61.98-.67 1.43l-.37 3.24c-.13 1.17.71 1.97 1.87 1.77l3.22-.55c.45-.08 1.08-.41 1.39-.75l8.21-8.69c1.42-1.5 2.06-3.21-.15-5.3-2.2-2.07-3.87-1.34-5.29.16Z" stroke="currentColor" stroke-miterlimit="10" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M11.89 5.05a6.126 6.126 0 0 0 5.45 5.15M3 22h18" stroke="currentColor" stroke-miterlimit="10" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span>ویرایش</span></button>
        <button class="task-action task-action--delete" type="button" data-action="delete" tabindex="-1"><svg aria-hidden="true" focusable="false" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M21 5.98c-3.33-.33-6.68-.5-10.02-.5-1.98 0-3.96.1-5.94.3L3 5.98M8.5 4.97l.22-1.31C8.88 2.71 9 2 10.69 2h2.62c1.69 0 1.82.75 1.97 1.67l.22 1.3M18.85 9.14l-.65 10.07C18.09 20.78 18 22 15.21 22H8.79C6 22 5.91 20.78 5.8 19.21L5.15 9.14M10.33 16.5h3.33M9.5 12.5h5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span>حذف</span></button>
      </div>
      <div class="task-body">
        <button class="kebab" type="button" data-action="more" aria-expanded="false"><svg aria-hidden="true" focusable="false" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="6" r="1.5" fill="currentColor"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/><circle cx="12" cy="18" r="1.5" fill="currentColor"/></svg></button>
        <input class="check" type="checkbox" />
        <label class="task-text">
          <span class="task-title"></span>
          <span class="task-desc"></span>
        </label>
        <div class="task-meta">
          <span class="task-time"></span>
          <span class="badge"></span>
        </div>
      </div>
    </li>
  </template>

  <script>
  (() => {
    const STORAGE_KEY = "today-tasks-v2";
    const LEGACY_KEY = "today-tasks";
    const DAYS_IN_MENU = 7;
    const TOAST_MS = 5000;
    const $ = (id) => document.getElementById(id);
    const root = document.documentElement;
    const SWIPE = () => parseFloat(getComputedStyle(root).getPropertyValue("--height-5xl")) * 2 + parseFloat(getComputedStyle(root).getPropertyValue("--space-2xs")) * 3;

    const el = {
      dateSelector: $("date-selector"), dateLabel: $("date-label"), dateMenu: $("date-menu"), tomorrow: $("tomorrow"),
      mainView: $("main-view"), summary: $("summary"), filters: $("filters"),
      searchInput: $("search-input"), searchButton: $("search-button"),
      tasks: $("tasks"), noResults: $("no-results"), listEnd: $("list-end"),
      empty: $("empty"), emptyMessage: $("empty-message"), addButton: $("add-button"),
      toasts: $("toast-region"),
      sheet: $("task-sheet"), form: $("task-form"), sheetTitle: $("sheet-title"), save: $("save-task"),
      fTitle: $("task-title"), fDesc: $("task-desc"), fRepeat: $("task-repeat"),
      timeTrigger: $("time-trigger"), timeValue: $("time-value"), timePicker: $("time-picker"),
      hours: $("hours"), minutes: $("minutes"), timeClear: $("time-clear"), timeDone: $("time-done"),
      dateTrigger: $("date-trigger"), dateValue: $("date-value"), datePicker: $("date-picker"),
      calTitle: $("cal-title"), calGrid: $("cal-grid"), calPrev: $("cal-prev"), calNext: $("cal-next"),
      template: $("task-template"),
    };

    // ---------- تاریخ (تقویم شمسی) ----------
    const startOfDay = (d) => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };
    const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
    const pad = (n) => String(n).padStart(2, "0");
    const keyOf = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    const dateOf = (key) => { const [y, m, d] = key.split("-").map(Number); return new Date(y, m - 1, d); };
    const faDigits = (s) => String(s).replace(/\d/g, (n) => "۰۱۲۳۴۵۶۷۸۹"[n]);
    const fmtLong = new Intl.DateTimeFormat("fa-IR-u-ca-persian", { weekday: "long", day: "numeric", month: "long" });
    const fmtMonth = new Intl.DateTimeFormat("fa-IR-u-ca-persian", { month: "long", year: "numeric" });
    const fmtNum = new Intl.DateTimeFormat("en-US-u-ca-persian", { year: "numeric", month: "numeric", day: "numeric" });
    const persianParts = (d) => Object.fromEntries(fmtNum.formatToParts(d).filter((p) => p.type !== "literal").map((p) => [p.type, parseInt(p.value, 10)]));
    function persianDate(d) {
      const p = Object.fromEntries(fmtLong.formatToParts(d).map((x) => [x.type, x.value]));
      return `${p.weekday} ${p.day} ${p.month}`;
    }
    function relativeName(d) {
      const diff = Math.round((startOfDay(d) - startOfDay(new Date())) / 864e5);
      return diff === 0 ? "امروز" : diff === 1 ? "فردا" : "";
    }
    const dayLabel = (d) => { const r = relativeName(d); return r ? `${r} - ${persianDate(d)}` : persianDate(d); };
    const fmtShort = new Intl.DateTimeFormat("fa-IR-u-ca-persian", { day: "numeric", month: "long" });
    const shortLabel = (d) => { const r = relativeName(d); return r ? `${r}، ${fmtShort.format(d)}` : persianDate(d); };

    // ---------- ذخیره‌سازی ----------
    function load() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (Array.isArray(saved)) return saved;
        const legacy = JSON.parse(localStorage.getItem(LEGACY_KEY)) || {};
        return Object.entries(legacy).flatMap(([k, list]) => {
          const [y, m, d] = k.split("-").map(Number);
          return list.map((t) => ({ id: t.id, title: t.title, description: "", time: "", date: `${y}-${pad(m)}-${pad(d)}`, repeat: false, done: !!t.done, doneDates: [] }));
        });
      } catch { return []; }
    }
    function persist() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.tasks)); } catch {} }

    const state = { tasks: load(), selected: startOfDay(new Date()), filter: "all", query: "", openId: null, editingId: null };
    const selectedKey = () => keyOf(state.selected);
    const isDone = (t, key) => (t.repeat ? t.doneDates.includes(key) : t.done);
    const findTask = (id) => state.tasks.find((t) => t.id === id);
    const tasksForDay = (key) => state.tasks
      .filter((t) => t.date === null || t.date === key || (t.repeat && t.date <= key))
      .sort((a, b) => (a.time || "99").localeCompare(b.time || "99"));

    // ---------- رندر ----------
    function render() {
      const d = state.selected, key = selectedKey(), rel = relativeName(d);
      el.dateLabel.textContent = dayLabel(d);
      el.tomorrow.setAttribute("aria-pressed", String(rel === "فردا"));
      el.emptyMessage.textContent = `هیچ کاری ندارید برای ${rel || "این روز"}!`;

      const dayTasks = tasksForDay(key);
      const has = dayTasks.length > 0;
      el.mainView.hidden = el.listEnd.hidden = !has;
      el.empty.hidden = has;

      const done = dayTasks.filter((t) => isDone(t, key)).length;
      el.dateSelector.style.setProperty("--progress", has ? `${(done / dayTasks.length) * 100}%` : "0%");
      if (!has) return;
      el.summary.textContent = `${faDigits(done)} از ${faDigits(dayTasks.length)} مورد انجام شده`;

      const q = state.query.trim();
      const visible = dayTasks.filter((t) => {
        if (state.filter === "done" && !isDone(t, key)) return false;
        if (state.filter === "undated" && t.date !== null) return false;
        return !q || t.title.includes(q) || t.description.includes(q);
      });
      el.tasks.replaceChildren(...visible.map((t) => taskItem(t, key)));
      el.noResults.hidden = visible.length > 0;
    }

    function taskItem(t, key) {
      const li = el.template.content.firstElementChild.cloneNode(true);
      const done = isDone(t, key), open = state.openId === t.id;
      li.dataset.id = t.id;
      li.classList.toggle("is-done", done);
      li.classList.toggle("is-open", open);
      li.style.setProperty("--swipe", `${SWIPE()}px`);
      const check = li.querySelector(".check");
      check.id = `check-${t.id}`; check.checked = done;
      li.querySelector(".task-text").htmlFor = check.id;
      li.querySelector(".task-title").textContent = t.title;
      const desc = li.querySelector(".task-desc");
      desc.textContent = t.description; desc.hidden = !t.description;
      const time = li.querySelector(".task-time");
      time.textContent = t.time ? faDigits(t.time) : ""; time.hidden = !t.time;
      const badge = li.querySelector(".badge");
      badge.textContent = t.date === null ? "بدون تاریخ" : t.repeat ? "هر روز" : "";
      badge.hidden = !badge.textContent;
      const more = li.querySelector('[data-action="more"]');
      more.setAttribute("aria-label", `گزینه‌های ${t.title}`);
      more.setAttribute("aria-expanded", String(open));
      li.querySelectorAll(".task-action").forEach((b) => { b.tabIndex = open ? 0 : -1; b.setAttribute("aria-hidden", String(!open)); });
      li.querySelector('[data-action="edit"]').setAttribute("aria-label", `ویرایش ${t.title}`);
      li.querySelector('[data-action="delete"]').setAttribute("aria-label", `حذف ${t.title}`);
      return li;
    }

    // ---------- توست ----------
    let toastTimer = null;
    function toast(message, undo) {
      clearTimeout(toastTimer);
      const box = document.createElement("div");
      box.className = "toast";
      const msg = document.createElement("span");
      msg.className = "message"; msg.textContent = message;
      box.append(msg);
      if (undo) {
        const b = document.createElement("button");
        b.type = "button"; b.className = "toast-undo"; b.textContent = "بازگردانی";
        b.addEventListener("click", () => { undo(); el.toasts.replaceChildren(); });
        box.append(b);
      }
      el.toasts.replaceChildren(box);
      toastTimer = setTimeout(() => el.toasts.replaceChildren(), TOAST_MS);
    }

    // ---------- رویدادهای لیست ----------
    el.tasks.addEventListener("change", (e) => {
      if (!e.target.matches(".check")) return;
      const t = findTask(e.target.closest(".task").dataset.id), key = selectedKey();
      if (t.repeat) t.doneDates = e.target.checked ? [...new Set([...t.doneDates, key])] : t.doneDates.filter((k) => k !== key);
      else t.done = e.target.checked;
      persist(); render();
    });

    el.tasks.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-action]");
      if (!btn) return;
      const id = btn.closest(".task").dataset.id;
      if (btn.dataset.action === "more") {
        state.openId = state.openId === id ? null : id; render();
        if (state.openId) el.tasks.querySelector(`[data-id="${id}"] [data-action="edit"]`)?.focus({ preventScroll: true });
      } else if (btn.dataset.action === "edit") {
        state.openId = null; render(); openSheet(findTask(id));
      } else if (btn.dataset.action === "delete") {
        const index = state.tasks.findIndex((t) => t.id === id);
        const [removed] = state.tasks.splice(index, 1);
        state.openId = null; persist(); render();
        toast(`«${removed.title}» حذف شد`, () => { state.tasks.splice(index, 0, removed); persist(); render(); toast("کار برگردانده شد"); });
      }
    });

    // کشیدن کارت برای نمایش ویرایش و حذف (لمس و ماوس)
    let drag = null, suppressClickUntil = 0;
    el.tasks.addEventListener("pointerdown", (e) => {
      const body = e.target.closest(".task-body");
      if (!body || (e.pointerType === "mouse" && e.button !== 0)) return;
      const li = body.closest(".task");
      drag = { li, body, x: e.clientX, y: e.clientY, base: li.classList.contains("is-open") ? -SWIPE() : 0, moved: false, pos: 0, id: e.pointerId };
    });
    el.tasks.addEventListener("pointermove", (e) => {
      if (!drag || e.pointerId !== drag.id) return;
      const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      if (!drag.moved) {
        if (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)) { drag = null; return; } // اسکرول عمودی
        if (Math.abs(dx) < 10) return;
        drag.moved = true; drag.li.classList.add("is-dragging");
        try { drag.body.setPointerCapture(e.pointerId); } catch {}
      }
      drag.pos = Math.min(0, Math.max(-SWIPE(), drag.base + dx));
      drag.body.style.transform = `translateX(${drag.pos}px)`;
    });
    function endDrag(e) {
      if (!drag || (e && e.pointerId !== drag.id)) return;
      const { li, body, moved, pos } = drag;
      drag = null;
      if (!moved) return;
      li.classList.remove("is-dragging");
      body.style.transform = "";
      state.openId = pos < -SWIPE() / 2 ? li.dataset.id : null;
      suppressClickUntil = Date.now() + 350; // فقط کلیکِ بلافاصله بعد از کشیدن نادیده گرفته می‌شود
      render();
    }
    el.tasks.addEventListener("pointerup", endDrag);
    el.tasks.addEventListener("pointercancel", endDrag);
    document.addEventListener("click", (e) => {
      if (Date.now() < suppressClickUntil) { e.preventDefault(); e.stopPropagation(); }
    }, true);

    document.addEventListener("click", (e) => {
      if (!e.target.isConnected) return;
      if (state.openId && !e.target.closest(".task.is-open")) { state.openId = null; render(); }
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && state.openId && !el.sheet.open) {
        const id = state.openId; state.openId = null; render();
        el.tasks.querySelector(`[data-id="${id}"] .kebab`)?.focus();
      }
    });

    // ---------- فیلترها و جستجو ----------
    el.filters.addEventListener("click", (e) => {
      const chip = e.target.closest(".chip");
      if (!chip) return;
      state.filter = chip.dataset.filter;
      el.filters.querySelectorAll(".chip").forEach((c) => c.setAttribute("aria-pressed", String(c === chip)));
      render();
    });
    function setSearch(on) {
      el.searchButton.setAttribute("aria-pressed", String(on));
      el.searchInput.hidden = !on; el.filters.hidden = on;
      if (on) el.searchInput.focus();
      else { el.searchInput.value = ""; state.query = ""; render(); }
    }
    el.searchButton.addEventListener("click", () => setSearch(el.searchInput.hidden));
    el.searchInput.addEventListener("input", () => { state.query = el.searchInput.value; render(); });
    el.searchInput.addEventListener("keydown", (e) => { if (e.key === "Escape") { setSearch(false); el.searchButton.focus(); } });

    // ---------- انتخاب روز (بالای صفحه) ----------
    function selectDay(d) { state.selected = startOfDay(d); state.openId = null; render(); }
    el.tomorrow.addEventListener("click", () => {
      const isTomorrow = el.tomorrow.getAttribute("aria-pressed") === "true";
      selectDay(addDays(new Date(), isTomorrow ? 0 : 1));
    });
    let activeIndex = 0;
    function openMenu() {
      const today = startOfDay(new Date());
      const days = Array.from({ length: DAYS_IN_MENU }, (_, i) => addDays(today, i));
      el.dateMenu.replaceChildren(...days.map((d, i) => {
        const li = document.createElement("li");
        li.role = "option"; li.id = `day-${i}`; li.textContent = dayLabel(d);
        const selected = keyOf(d) === selectedKey();
        li.setAttribute("aria-selected", String(selected));
        if (selected) activeIndex = i;
        li.addEventListener("click", () => { selectDay(d); closeMenu(); });
        return li;
      }));
      el.dateMenu.hidden = false;
      el.dateSelector.setAttribute("aria-expanded", "true");
      highlight(activeIndex); el.dateMenu.focus();
    }
    function closeMenu(returnFocus = true) {
      el.dateMenu.hidden = true;
      el.dateSelector.setAttribute("aria-expanded", "false");
      if (returnFocus) el.dateSelector.focus();
    }
    function highlight(i) {
      const items = el.dateMenu.children;
      activeIndex = (i + items.length) % items.length;
      [...items].forEach((li, n) => li.classList.toggle("is-active", n === activeIndex));
      el.dateMenu.setAttribute("aria-activedescendant", `day-${activeIndex}`);
    }
    el.dateSelector.addEventListener("click", () => (el.dateMenu.hidden ? openMenu() : closeMenu()));
    el.dateMenu.addEventListener("keydown", (e) => {
      if (e.key === "ArrowDown") { e.preventDefault(); highlight(activeIndex + 1); }
      else if (e.key === "ArrowUp") { e.preventDefault(); highlight(activeIndex - 1); }
      else if (e.key === "Enter" || e.key === " ") { e.preventDefault(); el.dateMenu.children[activeIndex].click(); }
      else if (e.key === "Escape" || e.key === "Tab") closeMenu(e.key === "Escape");
    });
    document.addEventListener("click", (e) => { if (!el.dateMenu.hidden && !e.target.closest(".date-field")) closeMenu(false); });

    // ---------- برگه: انتخابگر ساعت اختصاصی ----------
    const form = { time: "", date: null, calMonth: null };
    const HOURS = Array.from({ length: 24 }, (_, i) => pad(i));
    const MINUTES = Array.from({ length: 12 }, (_, i) => pad(i * 5));
    function timeOption(list, value, kind) {
      const b = document.createElement("button");
      b.type = "button"; b.className = "time-option"; b.role = "option";
      b.dataset[kind] = value; b.textContent = faDigits(value);
      return b;
    }
    function renderTime() {
      const [h, m] = form.time ? form.time.split(":") : ["", ""];
      const minutes = m && !MINUTES.includes(m) ? [...MINUTES, m].sort() : MINUTES;
      el.hours.replaceChildren(...HOURS.map((v) => timeOption(el.hours, v, "hour")));
      el.minutes.replaceChildren(...minutes.map((v) => timeOption(el.minutes, v, "minute")));
      el.hours.querySelectorAll(".time-option").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.hour === h)));
      el.minutes.querySelectorAll(".time-option").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.minute === m)));
      el.timeValue.textContent = form.time ? faDigits(form.time) : "ساعت (اختیاری)";
      el.timeValue.classList.toggle("is-empty", !form.time);
    }
    function scrollSelectedIntoView() {
      for (const list of [el.hours, el.minutes]) {
        const sel = list.querySelector('[aria-selected="true"]') || list.querySelector('[data-hour="09"]');
        if (sel) list.scrollTop = sel.offsetTop - list.clientHeight / 2 + sel.offsetHeight / 2;
      }
    }
    el.hours.addEventListener("click", (e) => {
      const b = e.target.closest("[data-hour]"); if (!b) return;
      const m = form.time ? form.time.split(":")[1] : "00";
      form.time = `${b.dataset.hour}:${m}`; renderTime();
    });
    el.minutes.addEventListener("click", (e) => {
      const b = e.target.closest("[data-minute]"); if (!b) return;
      const h = form.time ? form.time.split(":")[0] : pad(new Date().getHours());
      form.time = `${h}:${b.dataset.minute}`; renderTime();
    });
    el.timeClear.addEventListener("click", () => { form.time = ""; renderTime(); togglePicker(null); });
    el.timeDone.addEventListener("click", () => togglePicker(null));

    // ---------- برگه: انتخابگر تاریخ اختصاصی (ماه شمسی) ----------
    const WEEKDAYS = ["ش", "ی", "د", "س", "چ", "پ", "ج"];
    function monthStart(d) { const p = persianParts(d); return startOfDay(addDays(d, 1 - p.day)); }
    function renderDateValue() {
      el.dateValue.textContent = form.date ? shortLabel(dateOf(form.date)) : "بدون تاریخ";
      el.dateValue.classList.toggle("is-empty", !form.date);
      const today = keyOf(startOfDay(new Date())), tomorrow = keyOf(addDays(startOfDay(new Date()), 1));
      el.datePicker.querySelectorAll(".quick-date").forEach((b) => {
        const q = b.dataset.quick;
        const on = q === "none" ? form.date === null : form.date === (q === "0" ? today : tomorrow);
        b.setAttribute("aria-pressed", String(on));
      });
    }
    function renderCalendar() {
      const start = form.calMonth;
      const month = persianParts(start).month;
      el.calTitle.textContent = fmtMonth.format(start);
      const cells = WEEKDAYS.map((w) => { const s = document.createElement("span"); s.className = "cal-weekday"; s.textContent = w; s.setAttribute("aria-hidden", "true"); return s; });
      const lead = (start.getDay() + 1) % 7; // شنبه اولین ستون
      for (let i = 0; i < lead; i++) cells.push(document.createElement("span"));
      const todayKey = keyOf(startOfDay(new Date()));
      for (let d = new Date(start); persianParts(d).month === month; d = addDays(d, 1)) {
        const k = keyOf(d), b = document.createElement("button");
        b.type = "button"; b.className = "cal-day"; b.dataset.date = k;
        b.textContent = faDigits(persianParts(d).day);
        b.setAttribute("aria-label", dayLabel(d));
        b.setAttribute("aria-pressed", String(form.date === k));
        if (k === todayKey) b.classList.add("is-today");
        else if (k < todayKey) b.classList.add("is-past");
        cells.push(b);
      }
      el.calGrid.replaceChildren(...cells);
    }
    el.calPrev.addEventListener("click", () => { form.calMonth = monthStart(addDays(form.calMonth, -1)); renderCalendar(); });
    el.calNext.addEventListener("click", () => { form.calMonth = monthStart(addDays(form.calMonth, 32)); renderCalendar(); });
    function setFormDate(key) {
      form.date = key;
      if (!key) el.fRepeat.checked = false;
      renderDateValue(); renderCalendar(); togglePicker(null);
    }
    el.calGrid.addEventListener("click", (e) => { const b = e.target.closest("[data-date]"); if (b) setFormDate(b.dataset.date); });
    el.datePicker.querySelector(".quick-dates").addEventListener("click", (e) => {
      const b = e.target.closest("[data-quick]"); if (!b) return;
      const q = b.dataset.quick;
      setFormDate(q === "none" ? null : keyOf(addDays(startOfDay(new Date()), Number(q))));
    });

    function togglePicker(which) {
      const timeOn = which === "time" && el.timePicker.hidden;
      const dateOn = which === "date" && el.datePicker.hidden;
      el.timePicker.hidden = !timeOn; el.datePicker.hidden = !dateOn;
      el.timeTrigger.setAttribute("aria-expanded", String(timeOn));
      el.dateTrigger.setAttribute("aria-expanded", String(dateOn));
      if (timeOn) { scrollSelectedIntoView(); el.timePicker.scrollIntoView({ block: "nearest", behavior: "smooth" }); }
      if (dateOn) el.datePicker.scrollIntoView({ block: "nearest", behavior: "smooth" });
    }
    el.timeTrigger.addEventListener("click", () => togglePicker("time"));
    el.dateTrigger.addEventListener("click", () => togglePicker("date"));
    el.fRepeat.addEventListener("change", () => {
      if (el.fRepeat.checked && !form.date) { form.date = selectedKey(); renderDateValue(); renderCalendar(); }
    });

    // ---------- برگه: باز و بسته کردن (افزودن و ویرایش یکسان) ----------
    function openSheet(task = null) {
      state.editingId = task?.id ?? null;
      el.form.reset();
      el.sheet.returnValue = "";
      el.fTitle.value = task?.title ?? "";
      el.fDesc.value = task?.description ?? "";
      el.fRepeat.checked = !!task?.repeat;
      form.time = task?.time ?? "";
      form.date = task ? task.date : selectedKey();
      form.calMonth = monthStart(form.date ? dateOf(form.date) : new Date());
      renderTime(); renderDateValue(); renderCalendar(); togglePicker(null);
      el.sheetTitle.textContent = task ? "ویرایش کار" : "کار جدید";
      el.save.textContent = task ? "ذخیره" : "افزودن";
      el.save.disabled = !el.fTitle.value.trim();
      el.sheet.showModal();
      el.fTitle.focus();
    }
    el.addButton.addEventListener("click", () => openSheet());
    el.fTitle.addEventListener("input", () => { el.save.disabled = !el.fTitle.value.trim(); });
    el.sheet.addEventListener("close", () => {
      const title = el.fTitle.value.trim();
      if (el.sheet.returnValue !== "save" || !title) return;
      const fields = { title, description: el.fDesc.value.trim(), time: form.time, date: form.date || null, repeat: el.fRepeat.checked && !!form.date };
      const existing = state.editingId && findTask(state.editingId);
      if (existing) { Object.assign(existing, fields); toast("تغییرات ذخیره شد"); }
      else { state.tasks.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), done: false, doneDates: [], ...fields }); toast("کار اضافه شد"); }
      persist(); render();
    });
    el.sheet.addEventListener("click", (e) => { if (e.target === el.sheet) el.sheet.close(); });

    // بالا آمدن برگه همراه کیبورد
    if (window.visualViewport) {
      const vv = window.visualViewport;
      const sync = () => root.style.setProperty("--keyboard", `${Math.round(Math.max(0, window.innerHeight - vv.height - vv.offsetTop))}px`);
      vv.addEventListener("resize", sync); vv.addEventListener("scroll", sync);
    }

    render();
  })();
  </script>
</body>
</html>
